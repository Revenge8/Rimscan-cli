[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rimscan-cli"
version = "1.0.0"
description = "Standalone passive reconnaissance CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "beautifulsoup4>=4.12.0",
  "dnspython>=2.4.0",
  "requests>=2.31.0",
  "tqdm>=4.66.0",
  "urllib3>=2.0.0",
]

[project.scripts]
rimscan-cli = "rimscan_cli.cli:main"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["rimscan_cli*", "recon*"]

